services:
  - type: web
    name: sinetec
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: "./build.sh"
    startCommand: "gunicorn sinetec_project.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        value: "django-insecure-sinetec-adsi-magdalena-2026-production-key-fixed"
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
