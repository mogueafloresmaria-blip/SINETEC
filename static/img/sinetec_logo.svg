<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 100" fill="none">
  <defs>
    <!-- Linear Gradients for Modern Depth -->
    <linearGradient id="primaryEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#29AAE3" />
      <stop offset="50%" stop-color="#288900" />
      <stop offset="100%" stop-color="#0E541E" />
    </linearGradient>
    <linearGradient id="neonMint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4EFA8A" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>
    <linearGradient id="techSlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#29AAE3" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- ISOTIPO SINETEC -->
  <g transform="translate(10, 10)" filter="url(#subtleGlow)">
    <!-- Base Rounded Shield / Container -->
    <rect width="80" height="80" rx="22" fill="url(#techSlate)" />
    
    <!-- Outer Technological Accent Ring -->
    <rect x="2" y="2" width="76" height="76" rx="20" fill="none" stroke="url(#primaryEmerald)" stroke-width="1.5" stroke-opacity="0.5" />
    
    <!-- Dynamic Interlocking 'S' & Tech Nodes -->
    <!-- Top Circuit Wing -->
    <path d="M 24 28 C 24 24, 32 20, 52 20 C 62 20, 66 25, 64 32 C 62 39, 52 42, 40 44" 
          stroke="url(#neonMint)" stroke-width="5.5" stroke-linecap="round" fill="none" />
          
    <!-- Bottom Circuit Wing -->
    <path d="M 56 52 C 56 56, 48 60, 28 60 C 18 60, 14 55, 16 48 C 18 41, 28 38, 40 36" 
          stroke="url(#primaryEmerald)" stroke-width="5.5" stroke-linecap="round" fill="none" />
    
    <!-- Central Fusion Core Pulse -->
    <circle cx="40" cy="40" r="5" fill="#FFFFFF" />
    <circle cx="40" cy="40" r="2.5" fill="url(#neonMint)" />

    <!-- Technical Connectivity Nodes -->
    <circle cx="24" cy="28" r="3.5" fill="url(#neonMint)" />
    <circle cx="56" cy="52" r="3.5" fill="url(#primaryEmerald)" />
  </g>

  <!-- LOGOTIPO / TIPOGRAFÍA -->
  <!-- Brand Name -->
  <text x="108" y="52" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="35" font-weight="800" letter-spacing="-0.02em" fill="#0F172A">
    SINETEC
  </text>

  <!-- Official Subtitle Aprobado: Gestión Media Técnica -->
  <text x="109" y="75" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="14" font-weight="600" letter-spacing="0.01em" fill="#475569">
    Gestión Media Técnica
  </text>
</svg>
