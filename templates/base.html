<!DOCTYPE html>
{% load static %}
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EDUNOVA · Sistema Integrado de Educación Técnica{% endblock %}</title>
    
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- Google Fonts: Plus Jakarta Sans & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    
    <!-- Sistema de Diseño EDUNOVA Escolar -->
    <link rel="stylesheet" href="{% static 'css/sinetec.css' %}?v=20260925sky">
    <link rel="stylesheet" href="{% static 'css/sinetec_custom.css' %}?v=20260925sky">
    <style>
        /* SISTEMA INSTITUCIONAL EDUNOVA - PALETA ROSA ELEGANTE UNIFICADA */
        body,
        body.role-docente,
        body.bg-pink-shell {
            background-color: #fdf2f4 !important;
            background: #fdf2f4 !important;
        }

        .sinetec-shell,
        body.role-docente .sinetec-shell {
            background-color: #fdf2f4 !important;
            background: #fdf2f4 !important;
        }

        .sinetec-main,
        body.role-docente .sinetec-main,
        body.role-docente .docente-shell {
            background: #fdf2f4 !important;
            background-color: #fdf2f4 !important;
        }

        /* SIDEBAR UNIFICADO: BLANCO PURO, ROSADO ELEGANTE, SCROLL FLUIDO */
        .sinetec-sidebar,
        body.role-docente .sinetec-sidebar,
        .sinetec-sidebar.is-docente-sidebar {
            background: #ffffff !important;
            background-color: #ffffff !important;
            color: #1e293b !important;
            border-right: 1px solid #fce7f3 !important;
            box-shadow: 2px 0 10px rgba(219, 39, 119, 0.02) !important;
            width: 255px !important;
            min-width: 255px !important;
            max-width: 255px !important;
            height: 100vh !important;
            max-height: 100vh !important;
            position: fixed !important;
            top: 0 !important;
            bottom: 0 !important;
            left: 0 !important;
            z-index: 1025 !important;
            overflow-y: auto !important;
            overflow-x: hidden !important;
            overscroll-behavior: contain !important;
            display: flex !important;
            flex-direction: column !important;
            scrollbar-width: thin !important;
            scrollbar-color: #f472b6 #fdf2f4 !important;
        }

        .sinetec-sidebar::-webkit-scrollbar,
        body.role-docente .sinetec-sidebar::-webkit-scrollbar,
        .sinetec-sidebar.is-docente-sidebar::-webkit-scrollbar {
            width: 5px !important;
        }

        .sinetec-sidebar::-webkit-scrollbar-thumb,
        body.role-docente .sinetec-sidebar::-webkit-scrollbar-thumb,
        .sinetec-sidebar.is-docente-sidebar::-webkit-scrollbar-thumb {
            background: #f472b6 !important;
            border-radius: 10px !important;
        }

        /* NAVEGACIÓN DENTRO DEL SIDEBAR */
        .sinetec-nav,
        body.role-docente .sinetec-nav,
        .sinetec-sidebar.is-docente-sidebar .sinetec-nav {
            overflow: visible !important;
            overflow-y: visible !important;
            flex: 1 0 auto !important;
            padding: 10px 12px 30px 12px !important;
            background: transparent !important;
        }

        /* BRAND / CABECERA DEL SIDEBAR */
        .sinetec-brand,
        body.role-docente .sinetec-brand,
        .sinetec-sidebar.is-docente-sidebar .sinetec-brand {
            background: transparent !important;
            border-bottom: 1px solid #fce7f3 !important;
            padding: 16px 18px !important;
            display: flex !important;
            align-items: center !important;
            gap: 12px !important;
            text-decoration: none !important;
            flex-shrink: 0 !important;
        }

        .sinetec-brand-icon,
        body.role-docente .sinetec-brand-icon,
        .sinetec-sidebar.is-docente-sidebar .sinetec-brand-icon {
            background: #ffffff !important;
            border: 1.5px solid #fce7f3 !important;
            color: #db2777 !important;
            width: 44px !important;
            height: 44px !important;
            border-radius: 12px !important;
            display: grid !important;
            place-items: center !important;
            box-shadow: 0 2px 8px rgba(219, 39, 119, 0.06) !important;
            flex-shrink: 0 !important;
            padding: 3px !important;
        }

        .sinetec-brand-title,
        body.role-docente .sinetec-brand-title,
        .sinetec-sidebar.is-docente-sidebar .sinetec-brand-title {
            color: #0f172a !important;
            font-weight: 800 !important;
            font-size: 1.15rem !important;
            display: flex !important;
            align-items: center !important;
            gap: 6px !important;
        }

        .sinetec-brand-title .badge,
        body.role-docente .sinetec-brand-title .badge,
        .sinetec-sidebar.is-docente-sidebar .sinetec-brand-title .badge {
            background: #f43f5e !important;
            color: #ffffff !important;
            border: none !important;
            border-radius: 8px !important;
            font-size: 0.6rem !important;
            padding: 2px 6px !important;
            font-weight: 700 !important;
        }

        .sinetec-brand-subtitle,
        body.role-docente .sinetec-brand-subtitle,
        .sinetec-sidebar.is-docente-sidebar .sinetec-brand-subtitle {
            color: #64748b !important;
            font-size: 0.72rem !important;
            font-weight: 500 !important;
        }

        /* LABELS Y LINKS PARA TODOS LOS ROLES */
        .sinetec-nav .sinetec-nav-label {
            color: #be185d !important;
            font-weight: 700 !important;
            font-size: 0.7rem !important;
            text-transform: uppercase !important;
            letter-spacing: 0.05em !important;
            padding: 10px 14px 4px !important;
        }

        .sinetec-nav .nav-link {
            display: flex !important;
            align-items: center !important;
            padding: 8px 14px !important;
            color: #334155 !important;
            font-weight: 500 !important;
            font-size: 0.88rem !important;
            text-decoration: none !important;
            border-radius: 12px !important;
            transition: all 0.15s ease !important;
            margin: 2px 0 !important;
            gap: 10px !important;
        }

        .sinetec-nav .nav-link i {
            color: #db2777 !important;
            font-size: 1.12rem !important;
            min-width: 22px !important;
            text-align: center !important;
        }

        .sinetec-nav .nav-link:hover {
            background-color: #fff1f5 !important;
            color: #db2777 !important;
        }

        .sinetec-nav .nav-link.active {
            background-color: #fce7f3 !important;
            color: #db2777 !important;
            font-weight: 700 !important;
        }

        .sinetec-nav .nav-link.active i {
            color: #db2777 !important;
        }

        /* OCULTAR ELEMENTOS QUE NO VAN EN EL SIDEBAR DOCENTE */
        body.role-docente .sinetec-sidebar-footer,
        body.role-docente .sidebar-bottom-actions,
        body.role-docente .teacher-role-selector,
        .is-docente-sidebar .sinetec-sidebar-footer,
        .is-docente-sidebar .sidebar-bottom-actions,
        .is-docente-sidebar .teacher-role-selector {
            display: none !important;
        }

        /* ITEMS DEL MENÚ LATERAL DOCENTE - ROSADO */
        .teacher-pink-item {
            display: flex !important;
            align-items: center !important;
            padding: 9px 14px !important;
            color: #334155 !important;
            font-weight: 500 !important;
            font-size: 0.88rem !important;
            text-decoration: none !important;
            border-radius: 12px !important;
            transition: all 0.15s ease !important;
            margin: 2px 0 !important;
            border: none !important;
        }

        .teacher-pink-item i,
        .teacher-pink-item .teacher-icon-pink {
            color: #db2777 !important;
            font-size: 1.15rem !important;
            min-width: 24px !important;
            text-align: center !important;
            transition: none !important;
        }

        .teacher-pink-item:hover {
            background-color: #fff1f5 !important;
            color: #db2777 !important;
        }

        .teacher-pink-item.is-active {
            background-color: #fce7f3 !important;
            color: #db2777 !important;
            font-weight: 700 !important;
            border: none !important;
            box-shadow: none !important;
        }

        .teacher-pink-item.is-active i,
        .teacher-pink-item.is-active .teacher-icon-pink {
            color: #db2777 !important;
        }
    {% block extra_head %}{% endblock %}
    {% block extra_css %}{% endblock %}
</head>
<body class="{% if 'Docente' in request.user.perfil.rol.nombre or 'Instructor' in request.user.perfil.rol.nombre or 'Profesor' in request.user.perfil.rol.nombre or '/instructor/' in request.path or '/perfil-profesional/' in request.path or '/mis-asignaturas/' in request.path or '/mis-estudiantes/' in request.path or '/actividades-y-tareas/' in request.path or '/asistencia/' in request.path %}role-docente bg-pink-shell{% endif %}">

    <div class="sinetec-shell {% if request.resolver_match.url_name == 'home' or request.path == '/' %}is-home-landing{% endif %}" id="sinetecShell">
        {% if request.resolver_match.url_name != 'home' and request.path != '/' %}
        <!-- SIDEBAR INSTITUCIONAL ESCOLAR -->
        <aside class="sinetec-sidebar {% if 'Docente' in request.user.perfil.rol.nombre or 'Instructor' in request.user.perfil.rol.nombre or 'Profesor' in request.user.perfil.rol.nombre or '/instructor/' in request.path or '/perfil-profesional/' in request.path or '/mis-asignaturas/' in request.path or '/mis-estudiantes/' in request.path or '/actividades-y-tareas/' in request.path or '/asistencia/' in request.path %}is-docente-sidebar{% endif %}" id="sinetecSidebar">
            <!-- Barra superior móvil con botón de cierre -->
            <div class="d-flex align-items-center justify-content-between p-3 border-bottom border-white border-opacity-10 d-lg-none" style="background: rgba(0,0,0,0.2);">
                <div class="d-flex align-items-center gap-2 text-white">
                    <img src="{% static 'img/edunova_logo_transparent.png' %}" alt="EDUNOVA" style="width: 28px; height: 28px; object-fit: contain;">
                    <strong class="font-heading">EDUNOVA</strong>
                </div>
                <button type="button" class="btn btn-sm btn-outline-light rounded-circle" onclick="toggleSinetecSidebar();" aria-label="Cerrar menú">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>

            {% with rol=request.user.perfil.rol.nombre|default:'' %}
            <!-- Marca e Identidad Institucional EDUNOVA -->
            <a class="sinetec-brand" href="{% if 'Estudiante' in rol or 'Aprendiz' in rol %}{% url 'aprendiz_dashboard' %}{% elif 'Familia' in rol or 'Acudiente' in rol %}{% url 'familia_portal' %}{% elif 'Docente' in rol or 'Instructor' in rol %}{% url 'instructor_dashboard' %}{% elif 'Secretar' in rol %}{% url 'secretaria_dashboard' %}{% elif 'Rector' in rol %}{% url 'rectoria_dashboard' %}{% else %}{% url 'dashboard' %}{% endif %}">
                <div class="sinetec-brand-icon" style="background: #ffffff !important; border: 1.5px solid #fce7f3 !important; box-shadow: 0 2px 8px rgba(219,39,119,0.06); display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 12px; padding: 3px;">
                    <img src="{% static 'img/edunova_logo_transparent.png' %}" alt="EDUNOVA" style="width: 36px; height: 36px; object-fit: contain;">
                </div>
                <div class="sinetec-brand-text">
                    <div class="sinetec-brand-title" title="EDUNOVA — Sistema Integrado de Educación Técnica" style="color: #0f172a; font-weight: 800; display: flex; align-items: center; gap: 6px;">
                        EDUNOVA
                        <span class="badge py-0 px-1" style="font-size: 0.6rem; background: #fce7f3; color: #db2777; border: 1px solid #fbcfe8; font-weight: 700;">PRO</span>
                    </div>
                    <div class="sinetec-brand-subtitle" title="Sistema Integrado de Educación Técnica" style="font-size: 0.72rem; color: #64748b; font-weight: 500;">Educación Técnica</div>
                </div>
            </a>



            <!-- Navegación Estructurada y Filtrada Exclusivamente por Rol -->
            <nav class="sinetec-nav">
                {% if 'Estudiante' in rol or 'Aprendiz' in rol %}
                    <!-- 1. ESTUDIANTE -->
                    <div class="sinetec-nav-label">Mi Portal</div>
                    <a class="nav-link {% if request.resolver_match.url_name == 'aprendiz_dashboard' or request.resolver_match.url_name == 'aula_aprendiz' %}active{% endif %}" href="{% url 'aprendiz_dashboard' %}">
                        <i class="bi bi-grid-1x2-fill"></i> Mi Inicio
                    </a>
                    <a class="nav-link" href="{% url 'aprendiz_dashboard' %}#tab-calificaciones" onclick="activarTab('tab-calificaciones');">
                        <i class="bi bi-clipboard2-data-fill"></i> Mis Calificaciones
                    </a>
                    <a class="nav-link" href="{% url 'aprendiz_dashboard' %}#tab-horario" onclick="activarTab('tab-horario');">
                        <i class="bi bi-calendar2-week-fill"></i> Mi Horario
                    </a>
                    <a class="nav-link" href="{% url 'aprendiz_dashboard' %}#tab-actividades" onclick="activarTab('tab-actividades');">
                        <i class="bi bi-pencil-square"></i> Mis Tareas
                    </a>
                    <a class="nav-link" href="{% url 'aprendiz_dashboard' %}#tab-asistencia" onclick="activarTab('tab-asistencia');">
                        <i class="bi bi-check2-square"></i> Mi Asistencia
                    </a>
                    <div class="sinetec-nav-label">Canales</div>
                    <a class="nav-link {% if 'mensajeria' in request.resolver_match.url_name %}active{% endif %}" href="{% url 'mensajeria' %}">
                        <i class="bi bi-megaphone-fill"></i> Comunicados
                    </a>
                    <a class="nav-link {% if request.resolver_match.url_name == 'comunicaciones' %}active{% endif %}" href="{% url 'comunicaciones' %}">
                        <i class="bi bi-chat-heart-fill"></i> Mensajería
                    </a>
                    <a class="nav-link {% if 'portafolio' in request.resolver_match.url_name %}active{% endif %}" href="{% url 'portafolio_aprendiz' %}">
                        <i class="bi bi-journal-bookmark-fill"></i> Mi Portafolio
                    </a>

                {% elif 'Familia' in rol or 'Acudiente' in rol %}
                    <!-- 2. FAMILIA / ACUDIENTE -->
                    <div class="sinetec-nav-label">Familia</div>
                    <a class="nav-link {% if request.resolver_match.url_name == 'familia_portal' or request.resolver_match.url_name == 'familia_portal_alt' %}active{% endif %}" href="{% url 'familia_portal' %}">
                        <i class="bi bi-house-heart-fill"></i> Resumen de mis Hijos
                    </a>
                    <a class="nav-link {% if request.resolver_match.url_name == 'familia_matricula' %}active{% endif %}" href="{% url 'familia_matricula' %}">
                        <i class="bi bi-person-vcard-fill"></i> Ficha de Matrícula
                    </a>
                    <a class="nav-link {% if request.resolver_match.url_name == 'familia_boletines' %}active{% endif %}" href="{% url 'familia_boletines' %}">
                        <i class="bi bi-clipboard2-data-fill"></i> Boletines y Notas
                    </a>
                    <a class="nav-link {% if request.resolver_match.url_name == 'familia_asistencia' %}active{% endif %}" href="{% url 'familia_asistencia' %}">
                        <i class="bi bi-calendar-check-fill"></i> Asistencia de Hijos
                    </a>
                    <a class="nav-link {% if request.resolver_match.url_name == 'familia_pensiones' %}active{% endif %}" href="{% url 'familia_pensiones' %}">
                        <i class="bi bi-receipt"></i> Recibos de Pensión
                    </a>
                    <div class="sinetec-nav-label">Comunicación</div>
                    <a class="nav-link {% if 'mensajeria' in request.resolver_match.url_name %}active{% endif %}" href="{% url 'mensajeria' %}">
                        <i class="bi bi-megaphone-fill"></i> Circulares Oficiales
                    </a>

                {% elif 'Docente' in rol or 'Instructor' in rol or 'Profesor' in rol or '/instructor/' in request.path or '/perfil-profesional/' in request.path or '/mis-asignaturas/' in request.path or '/mis-estudiantes/' in request.path or '/alumno/' in request.path or '/actividades-y-tareas/' in request.path or '/asistencia/' in request.path or '/calificaciones-docente/' in request.path or '/horario' in request.path or '/comunicaciones-docente/' in request.path or '/notificaciones-docente/' in request.path or '/papelera-docente/' in request.path %}
                    <!-- 3. DOCENTE: MENÚ LATERAL OFICIAL EDUNOVA CON DISEÑO ROSA ELEGANTE -->
                    <div class="teacher-sidebar-pink p-1">
                        <!-- 1. Inicio -->
                        <div class="teacher-menu-group mb-1">
                            <a href="{% url 'instructor_dashboard' %}?subpanel=inicio" class="teacher-pink-item {% if subpanel_activo == 'inicio' or not subpanel_activo and not request.GET.subpanel %}is-active{% endif %}" id="nav-item-inicio">
                                <span class="d-flex align-items-center gap-3">
                                    <i class="bi bi-house-door-fill teacher-icon-pink"></i>
                                    <span class="teacher-label-text">Inicio</span>
                                </span>
                            </a>
                        </div>

                        <!-- 2. Mis Estudiantes -->
                        <div class="teacher-menu-group mb-1">
                            <a href="{% url 'mis_estudiantes' %}" class="teacher-pink-item {% if subpanel_activo == 'estudiantes' %}is-active{% endif %}" id="nav-item-estudiantes">
                                <span class="d-flex align-items-center gap-3">
                                    <i class="bi bi-people-fill teacher-icon-pink"></i>
                                    <span class="teacher-label-text">Mis Estudiantes</span>
                                </span>
                            </a>
                        </div>

                        <!-- 3. Mis Grupos -->
                        <div class="teacher-menu-group mb-1">
                            <a href="{% url 'mis_grupos' %}" class="teacher-pink-item {% if subpanel_activo == 'grupos' %}is-active{% endif %}" id="nav-item-grupos">
                                <span class="d-flex align-items-center gap-3">
                                    <i class="bi bi-collection-fill teacher-icon-pink"></i>
                                    <span class="teacher-label-text">Mis Grupos</span>
                                </span>
                            </a>
                        </div>

                        <!-- 4. Mis Asignaturas -->
                        <div class="teacher-menu-group mb-1">
                            <a href="{% url 'mis_asignaturas' %}" class="teacher-pink-item {% if subpanel_activo == 'asignaturas' %}is-active{% endif %}" id="nav-item-asignaturas">
                                <span class="d-flex align-items-center gap-3">
                                    <i class="bi bi-book-half teacher-icon-pink"></i>
                                    <span class="teacher-label-text">Mis Asignaturas</span>
                                </span>
                            </a>
                        </div>

                        <!-- 5. Horario Escolar -->
                        <div class="teacher-menu-group mb-1">
                            <a href="{% url 'horario_docente' %}" class="teacher-pink-item {% if subpanel_activo == 'horario' %}is-active{% endif %}" id="nav-item-horario">
                                <span class="d-flex align-items-center gap-3">
                                    <i class="bi bi-calendar-event-fill teacher-icon-pink"></i>
                                    <span class="teacher-label-text">Horario Escolar</span>
                                </span>
                            </a>
                        </div>

                        <!-- 6. Asistencia -->
                        <div class="teacher-menu-group mb-1">
                            <a href="{% url 'asistencia_docente' %}" class="teacher-pink-item {% if subpanel_activo == 'asistencia' %}is-active{% endif %}" id="nav-item-asistencia">
                                <span class="d-flex align-items-center gap-3">
                                    <i class="bi bi-check-square-fill teacher-icon-pink"></i>
                                    <span class="teacher-label-text">Asistencia</span>
                                </span>
                            </a>
                        </div>

                        <!-- 7. Actividades / Tareas -->
                        <div class="teacher-menu-group mb-1">
                            <a href="{% url 'actividades_tareas' %}" class="teacher-pink-item {% if subpanel_activo == 'actividades' or subpanel_activo == 'tareas' %}is-active{% endif %}" id="nav-item-actividades">
                                <span class="d-flex align-items-center gap-3">
                                    <i class="bi bi-journal-text teacher-icon-pink"></i>
                                    <span class="teacher-label-text">Actividades / Tareas</span>
                                </span>
                            </a>
                        </div>

                        <!-- 8. Calificaciones -->
                        <div class="teacher-menu-group mb-1">
                            <a href="{% url 'calificaciones_docente' %}" class="teacher-pink-item {% if subpanel_activo == 'calificaciones' %}is-active{% endif %}" id="nav-item-calificaciones">
                                <span class="d-flex align-items-center gap-3">
                                    <i class="bi bi-mortarboard-fill teacher-icon-pink"></i>
                                    <span class="teacher-label-text">Calificaciones</span>
                                </span>
                            </a>
                        </div>

                        <!-- 9. Comportamiento / Seguimiento -->
                        <div class="teacher-menu-group mb-1">
                            <a href="{% url 'comportamiento_docente' %}" class="teacher-pink-item {% if subpanel_activo == 'comportamiento' or subpanel_activo == 'seguimiento' %}is-active{% endif %}" id="nav-item-comportamiento">
                                <span class="d-flex align-items-center gap-3">
                                    <i class="bi bi-shield-check teacher-icon-pink"></i>
                                    <span class="teacher-label-text">Comportamiento</span>
                                </span>
                            </a>
                        </div>

                        <!-- 10. Recursos / Guías -->
                        <div class="teacher-menu-group mb-1">
                            <a href="{% url 'recursos_docente' %}" class="teacher-pink-item {% if subpanel_activo == 'recursos' or subpanel_activo == 'guias' %}is-active{% endif %}" id="nav-item-recursos">
                                <span class="d-flex align-items-center gap-3">
                                    <i class="bi bi-folder2-open teacher-icon-pink"></i>
                                    <span class="teacher-label-text">Recursos / Guías</span>
                                </span>
                            </a>
                        </div>

                        <!-- 11. Mensajes -->
                        <div class="teacher-menu-group mb-1">
                            <a href="{% url 'comunicaciones_docente' %}" class="teacher-pink-item {% if subpanel_activo == 'comunicaciones' or subpanel_activo == 'mensajeria' %}is-active{% endif %}" id="nav-item-comunicaciones">
                                <span class="d-flex align-items-center gap-3">
                                    <i class="bi bi-chat-dots-fill teacher-icon-pink"></i>
                                    <span class="teacher-label-text">Mensajes</span>
                                </span>
                            </a>
                        </div>

                        <!-- 12. Documentos -->
                        <div class="teacher-menu-group mb-1">
                            <a href="{% url 'documentos_docente' %}" class="teacher-pink-item {% if subpanel_activo == 'documentos' %}is-active{% endif %}" id="nav-item-documentos">
                                <span class="d-flex align-items-center gap-3">
                                    <i class="bi bi-file-earmark-text-fill teacher-icon-pink"></i>
                                    <span class="teacher-label-text">Documentos</span>
                                </span>
                            </a>
                        </div>

                        <!-- 13. Eventos / Calendario -->
                        <div class="teacher-menu-group mb-1">
                            <a href="{% url 'eventos_docente' %}" class="teacher-pink-item {% if subpanel_activo == 'eventos' or subpanel_activo == 'calendario' %}is-active{% endif %}" id="nav-item-eventos">
                                <span class="d-flex align-items-center gap-3">
                                    <i class="bi bi-calendar3-event-fill teacher-icon-pink"></i>

                            {% endif %}
                            <span class="d-none d-md-block text-truncate" style="max-width: 140px;">
                                <strong class="d-block small text-dark leading-tight">{{ user.get_full_name|default:user.username }}</strong>
                                <small class="text-muted" style="font-size: 0.72rem;">{{ user.perfil.rol.nombre|default:'Docente' }}</small>
                            </span>
                            <i class="bi bi-chevron-down text-muted small ms-1"></i>
                        </button>
                    {% endif %}
                    {% endwith %}
                        <ul class="dropdown-menu dropdown-menu-end shadow border-0 rounded-4 p-2 mt-2" style="min-width: 220px;">
                            <li class="px-3 py-2 border-bottom mb-1">
                                <div class="fw-bold text-dark small">{{ user.get_full_name|default:user.username }}</div>
                                <div class="text-muted" style="font-size: 0.75rem;">{{ user.email|default:'contacto@colegio.edu.co' }}</div>
                                <span class="badge badge-lavender-soft mt-1">
                                    {{ user.perfil.rol.nombre|default:'Usuario Institucional' }}
                                </span>
                            </li>
                            <li>
                                <a class="dropdown-item py-2 rounded-2" href="{% if 'Estudiante' in user.perfil.rol.nombre or 'Aprendiz' in user.perfil.rol.nombre %}{% url 'aprendiz_dashboard' %}{% elif 'Familia' in user.perfil.rol.nombre or 'Acudiente' in user.perfil.rol.nombre %}{% url 'familia_portal' %}{% elif 'Docente' in user.perfil.rol.nombre or 'Instructor' in user.perfil.rol.nombre %}{% url 'instructor_dashboard' %}{% elif 'Secretar' in user.perfil.rol.nombre %}{% url 'secretaria_dashboard' %}{% elif 'Rector' in user.perfil.rol.nombre %}{% url 'rectoria_dashboard' %}{% else %}{% url 'dashboard' %}{% endif %}">
                                    <i class="bi bi-speedometer2 text-primary me-2"></i> Mi Panel de Control
                                </a>
                            </li>
                            {% if 'Administrador' in user.perfil.rol.nombre or 'Secretar' in user.perfil.rol.nombre or user.is_superuser %}
                            <li>
                                <a class="dropdown-item py-2 rounded-2" href="{% url 'configuracion_sistema' %}">
                                    <i class="bi bi-sliders text-secondary me-2"></i> Configuración del Sistema
                                </a>
                            </li>
                            {% endif %}
                            <li><hr class="dropdown-divider my-1"></li>
                            <li>
                                <form method="post" action="{% url 'logout' %}" class="m-0 p-0">
                                    {% csrf_token %}
                                    <button type="submit" class="dropdown-item py-2 rounded-2 text-danger">
                                        <i class="bi bi-box-arrow-right me-2"></i> Cerrar Sesión
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </div>
                </div>
            </header>
            {% endif %}

            <!-- CONTENIDO DE LA PÁGINA -->
            <main class="sinetec-content {% if request.resolver_match.url_name == 'home' or request.path == '/' %}p-0 m-0 w-100 border-0 bg-transparent{% endif %}">
                {% if messages %}
                    <div class="container-fluid mt-3">
                        {% for message in messages %}
                            <div class="alert alert-{% if message.tags == 'error' %}danger{% elif message.tags %}{{ message.tags }}{% else %}success{% endif %} alert-dismissible fade show shadow-sm rounded-3" role="alert">
                                <i class="bi bi-info-circle-fill me-2"></i>{{ message }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                            </div>
                        {% endfor %}
                    </div>
                {% endif %}

                {% block content %}
                {% endblock %}
            </main>

            <!-- Bootstrap 5 JS Bundle -->
            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
            <script>
                function toggleSinetecCollapse() {
                    const shell = document.getElementById('sinetecShell');
                    if (shell) {
                        shell.classList.toggle('is-collapsed');
                    }
                }

                function toggleSinetecSidebar() {
                    const sb = document.getElementById('sinetecSidebar');
                    const bd = document.getElementById('sinetecBackdrop');
                    if (sb) sb.classList.toggle('is-open');
                    if (bd) bd.classList.toggle('is-visible');
                }

                function toggleSidebarGroup(groupId, e) {
                    if (e) e.stopPropagation();
                    const el = document.getElementById(groupId);
                    const chev = document.getElementById('chev-' + groupId);
                    if (el) {
                        const isOpen = (el.style.display === 'block');
                        el.style.display = isOpen ? 'none' : 'block';
                        if (chev) {
                            chev.style.transform = isOpen ? 'rotate(0deg)' : 'rotate(90deg)';
                        }
                    }
                }

                document.addEventListener('DOMContentLoaded', function() {
                    const sb = document.getElementById('sinetecSidebar');
                    const bd = document.getElementById('sinetecBackdrop');
                    if (sb) {
                        sb.querySelectorAll('.nav-link').forEach(function(link) {
                            link.addEventListener('click', function() {
                                if (window.innerWidth < 992) {
                                    sb.classList.remove('is-open');
                                    if (bd) bd.classList.remove('is-visible');
                                }
                            });
                        });
                    }
                    window.addEventListener('resize', function() {
                        if (window.innerWidth >= 992 && sb && bd) {
                            sb.classList.remove('is-open');
                            bd.classList.remove('is-visible');
                        }
                    });
                    const dateEl = document.getElementById('topbarLiveDateFormatted');
                    if (dateEl) {
                        const hoy = new Date();
                        const opciones = { weekday: 'short', day: 'numeric', month: 'short' };
                        dateEl.textContent = hoy.toLocaleDateString('es-CO', opciones);
                    }

                    // Manejador global de activación de pestañas mediante hash o función
                    function activarTab(tabId) {
                        if (!tabId) return;
                        const cleanId = tabId.replace(/^#/, '');
                        const tabBtn = document.getElementById(cleanId + '-btn') || document.querySelector(`[data-bs-target="#${cleanId}"]`);
                        if (tabBtn && typeof bootstrap !== 'undefined') {
                            const tabInstance = bootstrap.Tab.getOrCreateInstance(tabBtn);
                            tabInstance.show();
                            const pestanasEl = document.getElementById('seccion-pestanas') || tabBtn;
                            if (pestanasEl) {
                                pestanasEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
                            }
                        }
                    }
                    window.activarTab = activarTab;
                    if (window.location.hash && window.location.hash.startsWith('#tab-')) {
                        setTimeout(function() { activarTab(window.location.hash.substring(1)); }, 120);
                    }
                });
            </script>
            {% block extra_js %}{% endblock %}
        </div>
    </div>
</body>
</html>
