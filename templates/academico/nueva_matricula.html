{% extends 'base.html' %}
{% block title %}Nueva Matrícula · SINETEC{% endblock %}
{% block content %}
<style>
body{background:#f3f5f9!important}.nm-wrap{max-width:650px;margin:0 auto;padding:1.25rem}.nm-card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 5px 20px rgba(15,23,42,.09)}.nm-head{background:linear-gradient(110deg,#138bd5,#3aa4eb);color:#fff;padding:1.1rem 1.4rem;display:flex;justify-content:space-between;align-items:center}.nm-body{padding:1.5rem 1.8rem}.nm-label{font-size:.78rem;font-weight:900;color:#334155;margin-bottom:.45rem}.nm-submit{background:#128ddb;color:#fff;border:0;border-radius:8px;width:100%;padding:.75rem;font-weight:900}.nm-submit:hover{background:#0877ba;color:#fff}
</style>
<div class="nm-wrap"><div class="mb-3"><a href="{% url 'matriculas_lista' %}" class="text-decoration-none text-muted small fw-bold"><i class="bi bi-x-lg me-1"></i> Cancelar</a></div><div class="nm-card"><div class="nm-head"><h1 class="h5 fw-bold mb-0"><i class="bi bi-person-plus-fill me-2"></i>Nueva Matrícula</h1><span class="small opacity-75">Vigencia 2026</span></div><form method="post"><div class="nm-body">{% csrf_token %}<div class="mb-4"><label class="nm-label">1. Seleccione al Alumno</label><select name="alumno_id" class="form-select" required><option value="">-- Seleccionar Alumno --</option>{% for alumno in alumnos %}<option value="{{ alumno.pk }}">{{ alumno.get_full_name|default:alumno.username }} (DNI: {{ alumno.perfil.numero_documento }})</option>{% endfor %}</select><small class="text-muted">Solo se muestran alumnos activos sin matrícula vigente.</small></div><div class="row g-3 mb-4"><div class="col-md-7"><label class="nm-label">2. Grado / Año</label><select name="grado_escolar" class="form-select" required><option value="">-- Seleccionar --</option>{% for value,label in grados %}<option value="{{ value }}">{{ label }}</option>{% endfor %}</select></div><div class="col-md-5"><label class="nm-label"><span class="text-primary me-1">A</span>3. Sección</label><select name="seccion" class="form-select" required>{% for seccion in secciones %}<option value="{{ seccion }}">"{{ seccion }}"</option>{% endfor %}</select></div></div>{% if fichas|length > 1 %}<div class="mb-4"><label class="nm-label">Curso / Grupo</label><select name="ficha_id" class="form-select">{% for ficha in fichas %}<option value="{{ ficha.pk }}">{{ ficha.codigo_ficha }} · {{ ficha.programa.denominacion }}</option>{% endfor %}</select></div>{% endif %}<button class="nm-submit" type="submit"><i class="bi bi-save me-1"></i> Confirmar Matrícula</button></div></form></div></div>
{% endblock %}
