{% extends 'base.html' %}
{% block title %}Crear Tarea · {{ carga.programa.denominacion }}{% endblock %}
{% block content %}
<div class="max-w-3xl mx-auto py-10 px-4 sm:px-6">
    <div class="bg-white rounded-xl shadow-sm border p-6">
        <h2 class="text-2xl font-bold mb-6 text-gray-800">Nueva Tarea para {{ carga.programa.denominacion }} - {{ carga.grado }}°{{ carga.seccion }}</h2>
        <form method="post">
            {% csrf_token %}
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Título de la Tarea</label>
                <input type="text" name="titulo" class="w-full border-gray-300 rounded-lg shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border" required>
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Instrucciones</label>
                <textarea name="instrucciones" rows="4" class="w-full border-gray-300 rounded-lg shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border" required></textarea>
            </div>
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-1">Fecha y Hora Límite</label>
                <input type="datetime-local" name="fecha_limite" class="w-full border-gray-300 rounded-lg shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
            </div>
            <div class="flex gap-4">
                <a href="{% url 'detalle_clase' carga.id %}?tab=tareas" class="bg-gray-200 text-gray-800 px-4 py-2 rounded-lg font-medium hover:bg-gray-300 transition">Cancelar</a>
                <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-blue-700 transition">Publicar Tarea</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
