{% extends 'base.html' %}
{% block title %}Nuevo Cobro · SINETEC{% endblock %}
{% block content %}
<style>
body{background:#f3f5f9!important}.cobro-wrap{max-width:650px;margin:0 auto;padding:1.25rem}.cobro-card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 5px 20px rgba(15,23,42,.09)}.cobro-head{background:linear-gradient(110deg,#244ba1,#2863c1);color:#fff;padding:1.05rem 1.35rem;display:flex;justify-content:space-between;align-items:center}.cobro-body{padding:1.5rem 1.7rem}.cobro-label{font-size:.78rem;font-weight:900;color:#334155;margin-bottom:.4rem}.cobro-box{border:1px solid #dbe5ef;background:#f8fbff;border-radius:10px;padding:.8rem 1rem}.cobro-total{border-top:1px solid #e2e8f0;margin-top:1.4rem;padding-top:1.1rem;text-align:right}.cobro-total strong{font-size:1.7rem;color:#0f172a}.cobro-submit{background:#18b96a;color:#fff;border:0;border-radius:9px;width:100%;padding:.8rem;font-weight:900;font-size:1rem}.cobro-submit:hover{background:#0f9d58;color:#fff}
</style>
<div class="cobro-wrap"><div class="mb-3"><a class="text-decoration-none text-muted small fw-bold" href="{% url 'caja_pensiones' %}"><i class="bi bi-arrow-left me-1"></i> Volver a Caja</a></div><div class="cobro-card"><div class="cobro-head"><h1 class="h5 fw-bold mb-0"><i class="bi bi-cash-register me-2"></i>Nuevo Cobro</h1><span class="badge rounded-pill bg-white bg-opacity-25 px-3 py-2">{% now 'd/m/Y' %}</span></div><form method="post"><div class="cobro-body">{% csrf_token %}<div class="mb-4"><label class="cobro-label">1. Seleccionar Alumno</label><select name="estudiante_id" class="form-select" required><option value="">-- Seleccionar Alumno --</option>{% for estudiante in estudiantes %}<option value="{{ estudiante.pk }}">{{ estudiante.get_full_name|default:estudiante.username }} · {{ estudiante.perfil.numero_documento }}</option>{% endfor %}</select></div><div class="mb-4"><label class="cobro-label">2. Matrícula Anual</label><label class="cobro-box d-flex justify-content-between align-items-center w-100"><span><strong class="d-block">Cobrar Matrícula 2026</strong><small class="text-muted">Costo definido al registrar el pago</small></span><input type="checkbox" name="cobrar_matricula" class="form-check-input" style="width:2.5rem;height:1.3rem"></label></div><div class="mb-4"><label class="cobro-label">3. Mensualidad / Pensión</label><select name="pension" class="form-select"><option value="">-- Ninguna --</option><option value="Enero">Enero</option><option value="Febrero">Febrero</option><option value="Marzo">Marzo</option><option value="Abril">Abril</option><option value="Mayo">Mayo</option><option value="Junio">Junio</option><option value="Julio">Julio</option><option value="Agosto">Agosto</option><option value="Septiembre">Septiembre</option><option value="Octubre">Octubre</option><option value="Noviembre">Noviembre</option><option value="Diciembre">Diciembre</option></select></div><div class="row g-3"><div class="col-md-6"><label class="cobro-label">Método de Pago</label><select name="metodo_pago" class="form-select"><option>Efectivo</option><option>Transferencia</option><option>Tarjeta</option></select></div><div class="col-md-6"><label class="cobro-label">Comprobante (Opcional)</label><input type="file" class="form-control" disabled><small class="text-muted">Disponible próximamente</small></div></div><div class="cobro-total"><span class="d-block text-muted small">Total a Pagar</span><strong>$ <input name="monto" type="number" min="0.01" step="0.01" value="0.00" class="border-0 text-end" style="width:130px;background:transparent" required></strong></div><button class="cobro-submit mt-3" type="submit"><i class="bi bi-check-lg me-1"></i> Procesar Pago</button></div></form></div></div>
{% endblock %}
