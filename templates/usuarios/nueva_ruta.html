{% extends 'base.html' %}
{% block title %}Registrar Ruta · SINETEC{% endblock %}
{% block content %}
<style>
body{background:#f3f5f9!important}.ruta-wrap{max-width:650px;margin:0 auto;padding:1.25rem}.ruta-card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 5px 20px rgba(15,23,42,.09)}.ruta-head{background:linear-gradient(110deg,#2A5EAC,#397dcc);color:#fff;padding:1.1rem 1.4rem;display:flex;justify-content:space-between;align-items:center}.ruta-body{padding:1.5rem 1.8rem}.ruta-section{font-size:.9rem;font-weight:900;color:#2A5EAC;border-bottom:1px solid #e2e8f0;padding-bottom:.6rem;margin:0 0 1rem}.ruta-label{font-size:.76rem;font-weight:800;color:#334155;margin-bottom:.35rem}.ruta-submit{background:#2A5EAC;color:#fff;border:0;border-radius:8px;width:100%;padding:.78rem;font-weight:900}.ruta-submit:hover{background:#214b8b;color:#fff}
</style>
<div class="ruta-wrap"><div class="mb-3"><a href="{% url 'transporte_escolar' %}" class="text-decoration-none text-muted small fw-bold"><i class="bi bi-arrow-left me-1"></i> Volver a Lista</a></div><div class="ruta-card"><div class="ruta-head"><h1 class="h5 fw-bold mb-0"><i class="bi bi-bus-front-fill me-2"></i>Registrar Ruta</h1><span class="small opacity-75">Transporte Escolar</span></div><form method="post"><div class="ruta-body">{% csrf_token %}<h2 class="ruta-section"><i class="bi bi-signpost-2 me-2"></i>Información de la Ruta</h2><div class="row g-3 mb-4"><div class="col-md-6"><label class="ruta-label">Nombre de la Ruta *</label><input name="nombre" class="form-control" placeholder="Ej: Ruta Norte - Los Olivos" required></div><div class="col-md-6"><label class="ruta-label">Conductor Asignado *</label><input name="conductor" class="form-control" placeholder="Nombre del Chofer" required></div></div><h2 class="ruta-section"><i class="bi bi-truck me-2"></i>Datos del Vehículo</h2><div class="row g-3 mb-4"><div class="col-md-6"><label class="ruta-label">Placa del Vehículo *</label><input name="placa" class="form-control" placeholder="ABC-123" required></div><div class="col-md-6"><label class="ruta-label">Capacidad (Asientos)</label><input name="capacidad" type="number" min="1" value="15" class="form-control" required></div><div class="col-md-6"><label class="ruta-label">Costo Mensual ($)</label><input name="costo_mensual" type="number" min="0" step="0.01" value="0.00" class="form-control" required></div></div><button class="ruta-submit" type="submit"><i class="bi bi-save me-1"></i> Guardar Ruta</button></div></form></div></div>
{% endblock %}
