{% extends 'base.html' %}
{% block title %}Nuevo Usuario · SINETEC{% endblock %}
{% block content %}
<style>
body{background:#f3f5f9!important}.usuario-wrap{max-width:760px;margin:0 auto;padding:1.25rem}.usuario-card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 5px 20px rgba(15,23,42,.09)}.usuario-head{background:#29445c;color:#fff;padding:1.15rem 1.4rem;display:flex;justify-content:space-between;align-items:center}.usuario-body{padding:1.5rem 1.7rem}.usuario-section{font-size:.9rem;font-weight:900;color:#334155;border-bottom:1px solid #e2e8f0;padding-bottom:.6rem;margin:0 0 1rem}.usuario-label{font-size:.75rem;font-weight:800;color:#475569;margin-bottom:.35rem}.usuario-submit{background:#29445c;color:#fff;border:0;border-radius:8px;padding:.7rem 1.4rem;font-weight:800}.usuario-submit:hover{background:#1f3446;color:#fff}
</style>
<div class="usuario-wrap"><div class="mb-3"><a class="text-decoration-none text-muted small fw-bold" href="{% url 'gestion_usuarios' %}"><i class="bi bi-arrow-left me-1"></i> Volver a Usuarios</a></div><div class="usuario-card"><div class="usuario-head"><h1 class="h5 fw-bold mb-0"><i class="bi bi-person-plus-fill me-2"></i>Nuevo Usuario</h1><span class="small opacity-75">Credenciales institucionales</span></div><form method="post"><div class="usuario-body">{% csrf_token %}<h2 class="usuario-section"><i class="bi bi-person me-2"></i>Datos Personales</h2><div class="row g-3 mb-4"><div class="col-md-6"><label class="usuario-label">Nombres *</label><input name="nombres" class="form-control" placeholder="Ej: María" required></div><div class="col-md-6"><label class="usuario-label">Apellidos *</label><input name="apellidos" class="form-control" placeholder="Ej: Gómez" required></div><div class="col-md-6"><label class="usuario-label">Correo Electrónico</label><input name="email" type="email" class="form-control" placeholder="usuario@colegio.edu.co"></div><div class="col-md-6"><label class="usuario-label">Documento *</label><input name="documento" class="form-control" placeholder="Número de documento" required></div></div><h2 class="usuario-section"><i class="bi bi-shield-fill me-2"></i>Cuenta y Permisos</h2><div class="row g-3"><div class="col-md-6"><label class="usuario-label">Usuario / DNI *</label><input name="username" class="form-control" placeholder="Usuario para login" required></div><div class="col-md-6"><label class="usuario-label">Contraseña *</label><input name="password" type="password" class="form-control" placeholder="Contraseña inicial" required></div><div class="col-md-6"><label class="usuario-label">Rol de Usuario *</label><select name="rol_id" class="form-select" required><option value="">-- Seleccionar Rol --</option>{% for rol in roles %}<option value="{{ rol.pk }}">{{ rol.nombre }}</option>{% endfor %}</select></div></div><div class="d-flex justify-content-end gap-2 border-top mt-4 pt-3"><a class="btn btn-light" href="{% url 'gestion_usuarios' %}">Cancelar</a><button class="usuario-submit" type="submit"><i class="bi bi-save me-1"></i> Crear Usuario</button></div></div></form></div></div>
{% endblock %}
